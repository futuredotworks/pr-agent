name: Docker Build and Push

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]  # Trigger on releases
    schedule:
      - cron: '0 0 * * *'  # Daily check for upstream releases

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/Codium-ai/pr-agent/releases/latest | jq -r .tag_name)
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push GitHub App image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pr-agent:latest
            ghcr.io/${{ github.repository_owner }}/pr-agent:${{ env.LATEST_TAG }}
          target: github_app
          cache-from: type=gha
          cache-to: type=gha,mode=max 
